      description: Entra em uma timetrial aleatória.
      usage: /timetrialcancel
      aliases: [ ttc, timetrialc, ttcancel ]
  voterace:
    description: Entra em uma timetrial aleatória.
    usage: /voterace
    aliases: [ vr ]
  race:
    description: Entra em uma timetrial aleatória.
    usage: /race
  party:
    description: Entra em uma timetrial aleatória.
    usage: /party
    aliases: [ p ]
  duel:
    description: Entra em uma timetrial aleatória.
    usage: /duel
  event:
    description: Base command for Events.
    usage: /event
  camera:
    description: Base command for cameras
    aliases: [ c, cam ]
  formulamario:
   description: Base command for formulamario
   aliases: [ fm, fmario, formulam ]
  formulawolf:
    description: Base command for formulawolf
    aliases: [ fw, fwolf, formulaw ]
  settings:
    description: Base command for settings
    aliases: [ s ]