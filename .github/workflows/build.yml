name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build
      run: mvn -B clean package

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: FormulaRacing-Plugin
        path: target/formularacing-*.jar
        retention-days: 30

