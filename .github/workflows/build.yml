name: Build

on:
  push:
    branches:
      - v3.1.0SNAPSHOT
  pull_request:
    branches:
      - v3.1.0SNAPSHOT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository has a Windows-only org.gradle.java.home in gradle.properties.
      # Remove it in CI so Gradle uses the JDK installed by setup-java.
      - name: Remove local JDK path from gradle.properties
        run: |
          set -euo pipefail
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          if grep -n 'org.gradle.java.home' gradle.properties; then
            echo "Unexpected org.gradle.java.home entry remains" >&2
            exit 1
          fi

      # JitPack publishes this commit only as master-592fabf3e2-1 (its POM says
      # master-SNAPSHOT), so the bare hash in build.gradle cannot resolve.
      # Install the published jar under the expected coordinates in mavenLocal.
      - name: Install java-mojang-api into local Maven
        run: |
          set -euo pipefail
          VERSION="592fabf3e2"
          JITPACK_VERSION="master-592fabf3e2-1"
          DEST="$HOME/.m2/repository/com/github/SparklingComet/java-mojang-api/$VERSION"
          mkdir -p "$DEST"
          BASE="https://jitpack.io/com/github/SparklingComet/java-mojang-api/$JITPACK_VERSION"
          curl -fsSL --retry 3 -o "$DEST/java-mojang-api-$VERSION.jar" \
            "$BASE/java-mojang-api-$JITPACK_VERSION.jar"
          cat > "$DEST/java-mojang-api-$VERSION.pom" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.SparklingComet</groupId>
            <artifactId>java-mojang-api</artifactId>
            <version>$VERSION</version>
            <dependencies>
              <dependency>
                <groupId>com.mashape.unirest</groupId>
                <artifactId>unirest-java</artifactId>
                <version>1.4.9</version>
              </dependency>
              <dependency>
                <groupId>com.googlecode.json-simple</groupId>
                <artifactId>json-simple</artifactId>
                <version>1.1.1</version>
              </dependency>
            </dependencies>
          </project>
          EOF

      # build.gradle compiles the Collisionless/NMS classes against a remapped
      # Paper server jar plus its runtime libraries. The repository does not
      # commit those jars, so generate them here with Paperclip.
      - name: Prepare NMS compile dependencies
        env:
          PAPER_VERSION: '26.3'
          PAPER_BUILD: '193'
          PAPER_SHA256: 'cf2dcb88fc1fcf5cbef68ba8151a50fa94087cd72843fafba0a964a1ef54c6bc'
        run: |
          set -euo pipefail

          PAPER_DIR="$RUNNER_TEMP/paper"
          PAPER_JAR="$PAPER_DIR/paper-${PAPER_VERSION}-${PAPER_BUILD}.jar"
          mkdir -p "$PAPER_DIR"

          curl -fsSL --retry 3 -o "$PAPER_JAR" \
            "https://fill-data.papermc.io/v1/objects/${PAPER_SHA256}/paper-${PAPER_VERSION}-${PAPER_BUILD}.jar"
          echo "${PAPER_SHA256}  ${PAPER_JAR}" | sha256sum -c -

          # Paperclip downloads the vanilla server, applies Paper's patches and
          # writes the remapped server jar + libraries into bundlerRepoDir.
          rm -rf .paperclip-cache
          mkdir -p .paperclip-cache
          java -Dpaperclip.patchonly=true \
            -DbundlerRepoDir="$PWD/.paperclip-cache" \
            -jar "$PAPER_JAR"

          SERVER_JAR="$(find "$PWD/.paperclip-cache/versions" -type f -name '*.jar' | head -n1)"
          if [ -z "$SERVER_JAR" ]; then
            echo "Paperclip did not produce a server jar." >&2
            find .paperclip-cache -maxdepth 4 -type f | sort >&2
            exit 1
          fi

          # Keep only NMS + CraftBukkit classes in the compile-only server jar.
          # This avoids the server jar's org.bukkit API shadowing paper-api on
          # the compile classpath (file dependencies come first in this build).
          EXTRACT="$RUNNER_TEMP/nms-server"
          CRAFTBUKKIT="$RUNNER_TEMP/craftbukkit"
          rm -rf "$EXTRACT" "$CRAFTBUKKIT"
          mkdir -p "$EXTRACT"
          (
            cd "$EXTRACT"
            jar xf "$SERVER_JAR"
          )
          # Keep CraftBukkit, drop the server's copy of the Bukkit API so it
          # cannot shadow the paper-api compileOnly dependency. Paper patches
          # (ca.spottedleaf.moonrise, etc.) must stay: NMS extends them.
          if [ -d "$EXTRACT/org/bukkit/craftbukkit" ]; then
            mkdir -p "$CRAFTBUKKIT"
            cp -a "$EXTRACT/org/bukkit/craftbukkit" "$CRAFTBUKKIT/"
          fi
          rm -rf "$EXTRACT/org/bukkit"
          if [ -d "$CRAFTBUKKIT/craftbukkit" ]; then
            mkdir -p "$EXTRACT/org/bukkit"
            mv "$CRAFTBUKKIT/craftbukkit" "$EXTRACT/org/bukkit/craftbukkit"
          fi

          mkdir -p libs/nms-libs
          jar --create --file libs/spigot-server-26.3.jar -C "$EXTRACT" .

          # Copy Paper's runtime libraries, but never the API jar (paper-api is
          # already a compileOnly Maven dependency and must win).
          find .paperclip-cache/libraries -type f -name '*.jar' \
            ! -path '*/paper-api/*' \
            -exec cp -n {} libs/nms-libs/ \;

          echo "Server jar: $SERVER_JAR"
          echo "NMS libraries: $(find libs/nms-libs -type f -name '*.jar' | wc -l)"

      - name: Build with Gradle
        run: ./gradlew build -x test --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: formularacing
          path: build/libs/*.jar
          if-no-files-found: error
