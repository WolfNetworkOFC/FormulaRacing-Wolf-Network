  top-limit: 15
  reveal-interval-ticks: 50 # 2.5s
  final-delay-ticks: 60
  snowball:
    enabled: true
  effects:
    sounds: true
    particles: true
  messages:
    start-chat: "&6Cerimonia do podio iniciada!"
    reveal-title: "&b#{pos}"
    reveal-subtitle: "&f{player}"
    reveal-chat: "&7#{pos} &e{player}"
    offline-top3-chat: "&7#{pos} &e{player} &8(offline)"
    end-chat: "&eCerimonia encerrada."
  locations:
    audience:
      world: "world"
      x: 0.0
      y: 80.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0
    p1:
      world: "world"
      x: 0.0
      y: 82.0
      z: -2.0
      yaw: 180.0
      pitch: 0.0
    p2:
      world: "world"
      x: -2.0
      y: 81.0
      z: -2.0
      yaw: 180.0
      pitch: 0.0
    p3:
      world: "world"
      x: 2.0
      y: 80.0
      z: -2.0
      yaw: 180.0
      pitch: 0.0
    lobby:
      world: "world"
      x: 0.0
      y: 70.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0

# =========================================================#
#                         ELO                             #
# =========================================================#
# ELO rating system for ranked duels (/duel ranked).
elo:
  default: 1200     # starting rating for new players
  kfactor: 32       # ELO calculation multiplier
  minchange: 1      # minimum ELO change per duel
  maxchange: 50     # maximum ELO change per duel

# =========================================================#
#                       HOLOGRAMS                         #
# =========================================================#
# Backend used for leaderboards/holograms:
#   armorstand         -> built-in (default, no extra plugin)
#   holographicdisplays-> requires the HolographicDisplays plugin installed
holograms:
  backend: armorstand
# Default server-wide accent colours (used for players who have not set a
# personal colour, and for console/non-player senders).
# Only 'primary' and 'accent' are applied — all body text / success / warning /
# error / info / award / broadcast colours are fixed semantic constants in code
# and are not overridable here (they are always legible on a dark background).
theme:
  primary: "#7bf200"   # server default colour-1 (player brand / highlight)
  accent:  "#00CC99"   # server default colour-2 (secondary highlight)
