name: FormulaRacing
version: 2.0
main: dev.EfraGroup.formulaRacing.FormulaRacing
api-version: 1.21
folia-supported: true
author: EfraGroup
description: Plugin de corrida de formula 1
depend:
  - WorldEdit
softdepend:
  - TAB
  - DecentHolograms
  - PlayerPoints
  - HeadDatabase
  - LuckPerms
  - PlaceholderAPI
  - floodgate
  - Geyser-Spigot
commands:
  boat:
    description: Dá um barco ao jogador
    usage: /boat
    aliases: [b]
  cam:
    description: Dá um barco ao jogador
    usage: /cam
  lonely:
    description: Time trial solitário
    usage: /lonely
  track:
    description: Gerenciamento de pistas
    usage: /track
    aliases: [t]
  trackedit:
    usage: /trackedit <create|select|delete|boatutils|region|checkpoint|time|icon|open|close|grid|pitlane|location>
    description: Editor completo de pistas (inclui configuração de grid e pit lanes)
    aliases: [te, trackeditor]
  debug:
    description: Comandos de debug
    usage: /debug
  admin:
    description: Comandos administrativos do FormulaRacing
    usage: /admin
    aliases: [fradmin, fra]
  formularacingreload:
    description: Recarrega as configurações do FormulaRacing
    usage: /formularacingreload
    aliases: [frr, frreload]
  timetrial:
    description: Começe uma TimeTrial
    usage: /timetrial
    aliases: [tt, timett]
  language:
    description: Muda a linguagem do FormulaRacing
    usage: /language
    aliases: [lang, l]
  reset:
    description: Reseta sua timetrial.
    usage: /reset
  timetrialrandom:
    description: Entra em uma timetrial aleatória.
    usage: /timetrialrandom
    aliases: [ttr, timetrialr, ttrandom]
  timetrialcancel:
    description: Entra em uma timetrial aleatória.
    usage: /timetrialcancel
    aliases: [ttc, timetrialc, ttcancel]
  voterace:
    description: Entra em uma timetrial aleatória.
    usage: /voterace
    aliases: [vr]
  race:
    description: Sistema de Quick Races (corridas rápidas casuais)
    usage: /race <create|join|leave|start|end|info>
    aliases: [qr, quickrace]
  party:
    description: Entra em uma timetrial aleatória.
    usage: /party
    aliases: [p]
  duel:
    description: Entra em uma timetrial aleatória.
    usage: /duel
  event:
    description: Gerenciamento de Eventos de Corrida (Event)
    usage: /event <list|info|create|delete|finish|sign|reserve|spectate|quit|settrack>
  round:
    description: Gerenciamento de Rodadas (Round)
    usage: /round <list|create|delete|info>
  heat:
    description: Gerenciamento de Baterias (Heat)
    usage: /heat <list|info|create|delete|load|start|finish|reset|set|add|remove>
  camera:
    description: Base command for cameras
    aliases: [c, cam]
  spectator:
    description: Configuração de áreas de espectadores/arquibancadas
    usage: /spectator <add|remove|list|test> <pista>
  spectate:
    description: Modo espectador para assistir corridas
    usage: /spectate <join|leave|follow|unfollow|list|info>
    aliases: [watch, observe]
  formulawolf:
    description: Base command for formulawolf
    aliases: [fw]
  settings:
    description: Base command for settings
    aliases: [s]
  pit:
    description: Inicia minigame de pit stop para teste
    usage: /pit
  podium:
    description: Configuracao e controle da cerimonia de podio
    usage: /podium <set|show|reload>
  ghost:
    description: Ghost manual de piloto em corrida
    usage: /ghost <jogador>
  unghost:
    description: Remove ghost manual de piloto
    usage: /unghost <jogador>
  daily:
    description: Gerenciamento de Daily Races
    usage: /daily <force|status|reload>
    permission: formularacing.admin.daily
  ai:
    description: Sistema de IA de oponentes
    usage: /ai <record|line|add|remove|difficulty|list|info>
    aliases: [opponent]
    permission: formularacing.admin
permissions:
  formularacing.admin:
    description: Permissao para comandos administrativos do FormulaRacing
    default: op
